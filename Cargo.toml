[workspace]
members = ["apps/native", "packages/engine"]
package.authors = ["Lemuel DLS"]
package.categories = []
package.description = "Local-first knowledge base built around the Typst language."
package.edition = "2024"
package.keywords = [""]
package.license = "AGPL-3.0"
package.repository = "https://github.com/lemueldls/typbase"
package.version = "0.1.0"
resolver = "3"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# nursery
option_if_let_else = "allow"
use_self = "allow"

# pedantic
format_push_string = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_closure_for_method_calls = "allow"
too_many_lines = "allow"
used_underscore_items = "allow"

[profile.release]
codegen-units = 1
debug = 0
incremental = false
lto = true
opt-level = 3
panic = "abort"

[profile.release.package."*"]
codegen-units = 1
debug = 0
incremental = false
opt-level = 3
