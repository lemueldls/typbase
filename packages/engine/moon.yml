language: "rust"
stack: "systems"
layer: "library"

tasks:
  build-dev:
    script: "printf '{}' > pkg/package.json && wasm-pack build --dev --target web --scope typbase ."
    inputs:
      - "Cargo.toml"
      - "pkg/package.json"
      - "src/**/*"
      - "!src/tests/fixtures/**/*"
      - "build.rs"
      - "/Cargo.toml"
      - "/Cargo.lock"
    outputs:
      - "pkg/**/*"

  build:
    script: "printf '{}' > pkg/package.json && wasm-pack build --release --target web --scope typbase ."
    inputs:
      - "Cargo.toml"
      - "pkg/package.json"
      - "src/**/*"
      - "!src/tests/fixtures/**/*"
      - "build.rs"
      - "/Cargo.toml"
      - "/Cargo.lock"
    outputs:
      - "pkg/**/*"

  test:
    script: "if cargo nextest --version >/dev/null 2>&1; then cargo nextest run -p engine --lib; else cargo test -p engine --lib; fi"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/apps/web/public/fonts/**/*"

  bench:
    script: "if cargo criterion --version >/dev/null 2>&1; then cargo criterion --bench engine; else cargo bench --bench engine; fi"
    options:
      runInCI: false
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "benches/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/apps/web/public/fonts/**/*"
