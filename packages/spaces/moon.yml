language: "typescript"
stack: "frontend"
layer: "library"
dependsOn:
  - "typing"
  - "skin"

tasks:
  build:
    command: "pnpm build"
    deps:
      - "typing:build"
      - "skin:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsdown.config.ts"
      - "package.json"
      - "/pnpm-lock.yaml"
      - "project://typing"
      - "project://skin"
    outputs:
      - "dist/**/*"

  build-dev:
    command: "pnpm build-dev"
    options:
      runInCI: false
      persistent: true
    deps:
      - "typing:build"
      - "skin:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsdown.config.ts"
      - "package.json"
      - "/pnpm-lock.yaml"
      - "project://typing"
      - "project://skin"
    outputs:
      - "dist/**/*"
