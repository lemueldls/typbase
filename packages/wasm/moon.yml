language: "rust"
stack: "systems"
layer: "library"

tasks:
  build-dev:
    script: "wasm-pack build --dev --target web --scope typbase . --features wasm-simd"
    inputs:
      - "Cargo.toml"
      - "pkg/package.json"
      - "src/**/*"
      - "!src/tests/fixtures/**/*"
      - "build.rs"
      - "/Cargo.toml"
      - "/Cargo.lock"
    outputs:
      - "pkg/**/*"

  build:
    script: "wasm-pack build --release --target web --scope typbase . --features wasm-simd"
    inputs:
      - "Cargo.toml"
      - "pkg/package.json"
      - "src/**/*"
      - "!src/tests/fixtures/**/*"
      - "build.rs"
      - "/Cargo.toml"
      - "/Cargo.lock"
    outputs:
      - "pkg/**/*"

  test:
    script: "cargo test -p wasm --lib"
    inputs:
      - "Cargo.toml"
      - "src/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "/apps/web/public/fonts/**/*"
