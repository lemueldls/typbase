language: "typescript"
stack: "frontend"
layer: "tool"

dependsOn:
  - "typing"
  - "skin"
  - "plugin-sdk"
  - "spaces"

tasks:
  build:
    command: "pnpm build"
    deps:
      - "typing:build"
      - "skin:build"
      - "plugin-sdk:build"
      - "spaces:build"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsdown.config.ts"
      - "package.json"
      - "/pnpm-lock.yaml"
      - "project://typing"
      - "project://skin"
      - "project://plugin-sdk"
      - "project://spaces"
    outputs:
      - "dist/**/*"

  build-dev:
    command: "pnpm build-dev"
    options:
      runInCI: false
      persistent: true
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsdown.config.ts"
      - "package.json"
      - "/pnpm-lock.yaml"
      - "project://typing"
      - "project://skin"
      - "project://plugin-sdk"
      - "project://spaces"
    outputs:
      - "dist/**/*"

  typecheck:
    command: "pnpm typecheck"
    inputs:
      - "src/**/*"
      - "tsconfig.json"
      - "tsdown.config.ts"
      - "package.json"
      - "/pnpm-lock.yaml"
