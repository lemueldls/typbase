name: Setup moon
description: Sets up pnpm, Node.js, and moon build cache

inputs:
  node-version:
    description: Node.js version to install
    required: false
    default: "26"

runs:
  using: composite
  steps:
    - name: 📥 Install Node.js and pnpm
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
        install: false

    - name: 💾 Restore moon cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          .moon/cache/hashes
          .moon/cache/outputs
        key: moon-cache-${{ runner.os }}-${{ hashFiles('.moon/**/*.yml', 'apps/**/moon.yml', 'packages/**/moon.yml', 'package.json', 'apps/web/package.json', 'pnpm-lock.yaml', 'apps/web/nuxt.config.ts', 'Cargo.toml', 'Cargo.lock', 'packages/engine/Cargo.toml', 'apps/native/Cargo.toml', 'rust-toolchain.toml') }}
        restore-keys: |
          moon-cache-${{ runner.os }}-
