name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  checks:
    name: 🔍 Checks
    runs-on: ubuntu-slim
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 🦀 Setup Rust
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          bins: wasm-pack
          targets: wasm32-unknown-unknown

      - name: 🌙 Setup moon
        uses: ./.github/actions/setup-moon

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Format check
        run: pnpm fmt:check

      - name: 🦀 Build @typbase/wasm
        run: pnpm wasm:build

      - name: 🧹 Lint
        run: pnpm lint

      - name: 🧠 Typecheck
        run: pnpm typecheck

      - name: 🔨 Build web app
        run: pnpm build

  engine:
    name: 🦀 Engine tests
    runs-on: ubuntu-slim
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 🦀 Setup Rust
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0

      - name: 🌙 Setup moon
        uses: ./.github/actions/setup-moon

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run engine tests
        run: pnpm moon run wasm:test
