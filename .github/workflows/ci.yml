name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # On main, all builds complete even if merging happens faster, so it is
  # easier to spot where something broke.
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: 🔨 Build
    runs-on: ubuntu-slim
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 🦀 Setup Rust
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          targets: wasm32-unknown-unknown

      - name: 🌙 Setup moon
        uses: ./.github/actions/setup-moon
        with:
          node-version: "26"

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎨 Format check
        run: pnpm fmt:check

      - name: 🧹 Lint
        run: pnpm lint

      - name: 🦀 Build @typbase/wasm (release)
        run: pnpm wasm:build:release

      - name: 🔨 Build web app
        run: pnpm build
