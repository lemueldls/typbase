name: Android

on:
  workflow_call:
    inputs:
      tagName:
        description: Release tag to upload assets to; empty builds artifacts only.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tagName:
        description: Release tag to upload assets to; leave empty for a test build.
        required: false
        type: string

env:
  NUXT_PUBLIC_APP_URL: ${{ vars.NUXT_PUBLIC_APP_URL || 'https://typbase.at' }}
  NDK_VERSION: "27.0.11902837"

jobs:
  build:
    name: 🤖 Android
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tagName || github.ref }}

      - name: 📝 Extract version from tauri.conf.json
        id: version
        shell: bash
        run: echo "version=$(bash scripts/ci/tauri-version.sh)" >> "$GITHUB_OUTPUT"

      - name: 🛡️ Verify tag matches version (publish only)
        if: inputs.tagName
        shell: bash
        run: bash scripts/ci/check-tag-version.sh "${{ inputs.tagName }}"

      - name: 🦀 Setup Rust
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          bins: wasm-pack@0.15.0
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,wasm32-unknown-unknown

      - name: ☕ Setup Java
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: zulu
          java-version: "26"

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: 🛠️ Install NDK
        run: sdkmanager "ndk;${{ env.NDK_VERSION }}"

      - name: 🌙 Setup moon
        uses: ./.github/actions/setup-moon

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔑 Extract Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: bash scripts/ci/android-signing.sh

      - name: 🔨 Build Android app (split APKs)
        run: pnpm moon run native:android-build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: 📦 Build Android bundle (Play AAB)
        run: pnpm moon run native:android-bundle
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: ✏️ Collect artifacts
        shell: bash
        run: bash scripts/ci/android-artifacts.sh "${{ steps.version.outputs.version }}" "${{ inputs.tagName }}"

      - name: 🔑 Check Play credentials
        id: play
        if: inputs.tagName
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No PLAY_SERVICE_ACCOUNT_JSON secret set; skipping the Play upload."
          fi

      - name: 🎡 Publish to Google Play
        if: steps.play.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: at.typbase.app
          releaseFiles: dist/Typbase_${{ steps.version.outputs.version }}_universal.aab
          tracks: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
          releaseName: ${{ steps.version.outputs.version }}

      - name: 📤 Upload build artifacts (test builds only)
        if: (!inputs.tagName)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: dist/*

      - name: 🚀 Attach to release (publish only)
        if: inputs.tagName
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ inputs.tagName }}
          draft: true
          files: dist/*

      - name: 🛡️ Attest build provenance (publish only)
        if: inputs.tagName
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/*
