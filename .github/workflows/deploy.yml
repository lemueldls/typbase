name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: ☁️ Deploy Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 🔍 Check configuration
        id: gate
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare secrets are not set; skipping the deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔄 Checkout
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 🦀 Setup Rust
        if: steps.gate.outputs.deploy == 'true'
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          bins: wasm-pack
          targets: wasm32-unknown-unknown

      - name: 🌙 Setup moon
        if: steps.gate.outputs.deploy == 'true'
        uses: ./.github/actions/setup-moon
        with:
          node-version: "26"

      - name: 📥 Install dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build web app
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm build
        env:
          NUXT_PUBLIC_APP_URL: ${{ vars.NUXT_PUBLIC_APP_URL || 'https://typbase.at' }}

      - name: 🚀 Deploy to Cloudflare Workers
        if: steps.gate.outputs.deploy == 'true'
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx --allow-build=esbuild,wrangler wrangler deploy
