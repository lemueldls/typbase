name: Nix

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tagName:
        description: Release tag to package.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tagName:
        description: Release tag to package.
        required: true
        type: string

jobs:
  update-flake:
    name: ❄️ Update flake
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: 🏷️ Resolve version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tagName || github.event.release.tag_name }}
        run: bash scripts/ci/resolve-version.sh

      - name: ❄️ Install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: ❄️ Install nix-update
        run: nix profile add nixpkgs#nix-update

      - name: 🔄 Update nix derivations
        env:
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: bash scripts/ci/nix-update-flake.sh "${{ steps.version.outputs.version }}"

  nixpkgs-pr:
    name: 📦 nixpkgs PR
    needs: update-flake
    if: vars.NIXPKGS_FORK != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 🏷️ Resolve version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tagName || github.event.release.tag_name }}
        run: bash scripts/ci/resolve-version.sh

      - name: ❄️ Install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: ❄️ Install nix-update
        run: nix profile add nixpkgs#nix-update

      - name: 📦 Update the nixpkgs fork
        env:
          NIXPKGS_FORK: ${{ vars.NIXPKGS_FORK }}
          NIXPKGS_TOKEN: ${{ secrets.NIXPKGS_TOKEN }}
        run: bash scripts/ci/nix-update-nixpkgs.sh "${{ steps.version.outputs.version }}"
