name: Publish npm Packages

on:
  release:
    types:
      - published
  workflow_call:
    inputs:
      tagName:
        description: Tag to publish from.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tagName:
        description: Tag to publish from; defaults to the current ref.
        required: false
        type: string

jobs:
  publish:
    name: 📦 Publish to npm
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          ref: ${{ inputs.tagName || github.event.release.tag_name || github.ref }}

      - name: 🦀 Setup Rust
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          bins: wasm-pack@0.15.1
          targets: wasm32-unknown-unknown

      - name: 🌙 Setup moon
        uses: ./.github/actions/setup-moon

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build shared packages
        run: pnpm packages:build

      - name: 📦 Check publish manifests
        run: pnpm check:packages

      - name: 📦 Publish @typbase/engine
        run: pnpm -C packages/engine/pkg publish --no-git-checks --provenance

      - name: 📦 Publish @typbase/typing
        run: pnpm -C packages/typing publish --no-git-checks --provenance

      - name: 📦 Publish @typbase/skin
        run: pnpm -C packages/skin publish --no-git-checks --provenance

      - name: 📦 Publish @typbase/plugin-sdk
        run: pnpm -C packages/plugin-sdk publish --no-git-checks --provenance

      - name: 📦 Publish @typbase/storage
        run: pnpm -C packages/storage publish --no-git-checks --provenance

      - name: 📦 Publish @typbase/spaces
        run: pnpm -C packages/spaces publish --no-git-checks --provenance

      - name: 📦 Publish @typbase/codemirror
        run: pnpm -C packages/codemirror publish --no-git-checks --provenance

      - name: 📦 Publish @typbase/cli
        run: pnpm -C packages/cli publish --no-git-checks --provenance
