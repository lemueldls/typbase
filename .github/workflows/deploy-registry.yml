name: Deploy Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-registry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 📚 Deploy registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      REGISTRY_PUBLISHERS: ${{ vars.REGISTRY_PUBLISHERS }}
      REGISTRY_WORKER_NAME: ${{ vars.REGISTRY_WORKER_NAME || 'typbase-registry' }}
      REGISTRY_URL: ${{ vars.REGISTRY_URL }}
    steps:
      - name: 🔍 Check configuration
        id: gate
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cloudflare credentials are not set; skipping the registry deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔄 Checkout
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 🌙 Setup moon
        if: steps.gate.outputs.deploy == 'true'
        uses: ./.github/actions/setup-moon
        with:
          node-version: "26"

      - name: 📥 Install dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - name: 🔨 Build the registry worker
        if: steps.gate.outputs.deploy == 'true'
        run: pnpm --filter @typbase/registry build
        env:
          NITRO_PRESET: cloudflare_module

      - name: 🛡️ Check the generated worker
        if: steps.gate.outputs.deploy == 'true'
        run: |
          node -e '
            const config = require("./apps/registry/.output/server/wrangler.json")
            if (!config.main || config.name !== process.env.REGISTRY_WORKER_NAME) {
              throw new Error("the registry build did not produce the expected worker")
            }
          '

      - name: 🧰 Prepare the Wrangler action
        if: steps.gate.outputs.deploy == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler-action"
          printf '{"private":true}\n' > "$RUNNER_TEMP/wrangler-action/package.json"

      - name: 🚀 Deploy to Cloudflare
        if: steps.gate.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ runner.temp }}/wrangler-action
          packageManager: npm
          wranglerVersion: "4"
          command: deploy --config ${{ github.workspace }}/apps/registry/.output/server/wrangler.json
