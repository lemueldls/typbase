name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry-run:
        description: Print the next version without writing or tagging
        required: true
        type: boolean
        default: true

jobs:
  bump:
    name: 🔢 Bump
    runs-on: ubuntu-slim
    permissions:
      contents: write
      # Dispatching the Release workflow needs this. A tag pushed with
      # GITHUB_TOKEN does not start a workflow on its own.
      actions: write
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: 📥 Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"

      - name: ⛰️ Install git-cliff
        run: bash scripts/ci/install-git-cliff.sh

      - name: 🔢 Bump, commit, and tag
        id: bump
        shell: bash
        env:
          BUMP: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: bash scripts/ci/bump-version.sh

      - name: 🚀 Start the release workflow
        if: ${{ !inputs['dry-run'] }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh workflow run release.yml --ref main -f "tag=typbase-v$VERSION"
