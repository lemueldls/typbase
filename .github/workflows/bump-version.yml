name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry-run:
        description: Print the next version without writing or tagging
        required: true
        type: boolean
        default: true

jobs:
  bump:
    name: 🔢 Bump
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: 🔄 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 📥 Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "26"

      - name: 🔢 Bump, commit, and tag
        id: bump
        shell: bash
        env:
          BUMP: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry-run }}
          SSH_SIGNING_KEY: ${{ secrets.SSH_SIGNING_KEY }}
        run: bash scripts/ci/bump-version.sh
