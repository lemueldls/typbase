name: Arch Linux AUR

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tagName:
        description: Release tag to package.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tagName:
        description: Release tag to package.
        required: true
        type: string

jobs:
  update:
    name: 🏔️ ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typbase
            script: scripts/distro/aur/generate-typbase.sh
          - name: typbase-bin
            script: scripts/distro/aur/generate-typbase-bin.sh
    steps:
      - name: 🛠️ Install tools
        run: |
          pacman -Sy --noconfirm --needed git openssh namcap sudo curl jq
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: 🔄 Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: 🏷️ Resolve version
        id: version
        shell: bash
        env:
          TAG: ${{ inputs.tagName || github.event.release.tag_name }}
        run: bash scripts/ci/resolve-version.sh

      - name: 🔢 Get sha256sum
        id: sums
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${{ matrix.name }}" == "typbase-bin" ]]; then
            URL="https://github.com/lemueldls/typbase/releases/download/typbase-v${VERSION}/Typbase_${VERSION}_amd64.deb"
          else
            URL="https://github.com/lemueldls/typbase/archive/refs/tags/typbase-v${VERSION}.tar.gz"
          fi

          echo "sha256=$(bash scripts/ci/url-sha256.sh "$URL")" >> "$GITHUB_OUTPUT"

      - name: 📐 Lint generated PKGBUILD
        shell: bash
        run: |
          su builder -c "bash \"$GITHUB_WORKSPACE/scripts/ci/aur-lint.sh\" \"${{ matrix.script }}\" ${{ steps.version.outputs.version }} ${{ steps.sums.outputs.sha256 }}"

      - name: 🛠️ Setup deployment key
        if: github.event_name == 'release' || inputs.tagName != ''
        shell: bash
        env:
          AUR_DEPLOY_KEY: ${{ secrets.AUR_DEPLOY_KEY }}
        run: bash scripts/ci/aur-setup-ssh.sh

      - name: 🌀 Generate PKGBUILD and publish
        if: github.event_name == 'release' || inputs.tagName != ''
        shell: bash
        run: |
          su builder -c "bash \"$GITHUB_WORKSPACE/scripts/ci/aur-publish.sh\" \"${{ matrix.name }}\" \"${{ matrix.script }}\" ${{ steps.version.outputs.version }} ${{ steps.sums.outputs.sha256 }}"
