packages:
  - platform/wasm/pkg
  - packages/*

allowBuilds:
  core-js: true
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: false
  vue-demi: true
  "@nuxtjs/i18n@https://codeload.github.com/onmax/i18n/tar.gz/cf1fb91708422e749ed36d753c012e99ac2cd3ac": true

overrides:
  "@atproto/lex-builder": "alpha"
  "@atproto/lex-client": "alpha"
  "@atproto/lex-document": "alpha"
  "@atproto/lex-installer": "alpha"
  "@atproto/lex-resolver": "alpha"
  "@atproto/lex-schema": "alpha"
