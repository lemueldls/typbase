language: "typescript"
stack: "frontend"
layer: "application"

dependsOn:
  - "spaces"
  - "skin"

tasks:
  dev:
    command: "pnpm nitro dev"
    preset: "server"
    options:
      persistent: true

  build:
    command: "pnpm nitro build"
    deps:
      - "spaces:build"
      - "skin:build"
    inputs:
      - "routes/**/*"
      - "lib/**/*"
      - "nitro.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
      - "$REGISTRY_*"
      - "project://spaces"
      - "project://skin"
    outputs:
      - ".output/**/*"

  typecheck:
    command: "pnpm typecheck"
    inputs:
      - "routes/**/*"
      - "lib/**/*"
      - "nitro.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "/pnpm-lock.yaml"
