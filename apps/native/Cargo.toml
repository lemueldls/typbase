[package]
name = "typbase"

authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
# this feature is used for production builds or when `devUrl` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
fontdb = "0.24.0"
notify = "8.1.0"
percent-encoding = "2.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ttf-parser = "0.25.0"

tauri = { version = "3.0.0-alpha.1", features = ["devtools"] }
tauri-plugin-deep-link = "3.0.0-alpha.0"
tauri-plugin-opener = "3.0.0-alpha.0"
tauri-plugin-process = "3.0.0-alpha.0"
# tauri-runtime-cef = { version = "3.0.0-alpha.1", features = ["devtools"] }
tauri-runtime-wry = { version = "3.0.0-alpha.1", features = ["devtools"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-cli = "3.0.0-alpha.0"
tauri-plugin-dialog = "3.0.0-alpha.0"
tauri-plugin-single-instance = { version = "3.0.0-alpha.0", features = ["deep-link"] }
tauri-plugin-updater = "3.0.0-alpha.0"

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.0", features = [] }

[lints]
workspace = true
