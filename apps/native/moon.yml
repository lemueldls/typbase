language: "rust"
stack: "systems"
layer: "application"
dependsOn:
  - "web"
  - "engine"

tasks:
  build:
    command: "pnpm tauri build"
    deps:
      - "web:build"
    inputs:
      - "Cargo.toml"
      - "build.rs"
      - "src/**/*"
      - "tauri.conf.json"
      - "tauri.package.conf.json"
      - "capabilities/**/*"
      - "icons/**/*"
      - "/Cargo.toml"
      - "/Cargo.lock"
      - "project://web"
      - "project://engine"
    outputs:
      - "/target/**/release/bundle/**/*"
      - "/target/**/release/typbase*"

  android-build:
    script: "pnpm tauri android build --apk --split-per-abi"
    deps:
      - "web:build"
    outputs:
      - "gen/android/app/build/outputs/apk/**/*"

  android-bundle:
    script: "pnpm tauri android build --aab"
    deps:
      - "web:build"
    outputs:
      - "gen/android/app/build/outputs/bundle/**/*"
