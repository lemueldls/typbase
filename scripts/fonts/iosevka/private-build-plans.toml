[buildPlans.IosevkaConcreteCode]
family = "Iosevka Concrete Code"
spacing = "normal"
serifs = "slab"
noCvSs = true
exportGlyphNames = false

[buildPlans.IosevkaConcreteCode.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.IosevkaConcreteCode.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.IosevkaConcreteCode.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevkaConcreteCode.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"

[buildPlans.IosevkaConcreteCode.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.IosevkaConcreteCode.variants.design]
four = "closed-serifed"
six = "open-contour"
nine = "open-contour"
zero = "unslashed"
capital-e = "serifed-capped"
capital-f = "serifed-capped"
capital-r = "standing-serifed"
capital-q = "closed-swash"
capital-w = "straight-almost-flat-top-serifed"
b = "toothed-motion-serifed"
c = "unilateral-inward-serifed"
g = "double-storey"
k = "straight-full-serifed"
m = "serifed"
q = "straight-bottom-serifed"
w = "straight-almost-flat-top-serifed"

[buildPlans.IosevkaConcreteCode.variants.italic]
capital-m = "flat-bottom-motion-serifed"
capital-n = "standard-motion-serifed"
capital-p = "closed-motion-serifed"
capital-t = "motion-serifed"
capital-u = "toothed-motion-serifed"
capital-v = "straight-motion-serifed"
capital-w = "straight-motion-serifed"
b = "toothless-rounded-serifed"
h = "tailed-motion-serifed"
m = "tailed-top-left-serifed"
n = "tailed-motion-serifed"
p = "eared-serifed"
u = "tailed-motion-serifed"
v = "cursive-serifed"
w = "rounded-vertical-sides-flat-top-motion-serifed"
f = "flat-hook-tailed"
g = "single-storey-serifless"
i = "serifed-flat-tailed"
l = "serifed-flat-tailed"
t = "narrow-bent-hook"

[buildPlans.IosevkaConcreteCode.metricOverride]
xHeight = 458
cap = 683
ascender = 683
leading = 1283

[buildPlans.IosevkaConcreteCode.ligations]
inherits = "default-calt"
disables = [
  "brst",
  "slash-asterisk",
  "html-comment",
  "ltgt-ne",
  "ltgt-diamond",
  "ltgt-diamond-tag",
  "ltgt-slash-tag",
  "trig",
  "markdown-checkboxes",
  "hash-hash",
  "hash-hash-hash",
  "underscore-underscore",
  "underscore-underscore-underscore",
  "tilde-tilde",
  "tilde-tilde-tilde",
  "minus-minus",
  "minus-minus-minus",
  "plus-plus",
  "plus-plus-plus",
  "colon-greater-as-colon-arrow",
  "logic",
]

# Latin, Greek, Cyrillic, Vietnamese, punctuation, currency, letterlike,
# arrows, math, box drawing, blocks, geometric shapes, symbols, dingbats,
# braille, and Powerline. Rare scripts and CJK stay out.
