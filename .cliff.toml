[changelog]
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="typbase-v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {%- endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "typbase-v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^\\w+(\\([^)]*\\))?!:", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->New" },
  # `fix: ci` and friends are pipeline repairs, not user-visible fixes.
  { message = "^fix(\\([^)]*\\))?: ci\\b", skip = true },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^perf", group = "<!-- 3 -->Improved" },
  { message = ".*", skip = true },
]
