language: "rust"
stack: "systems"
layer: "library"

tasks:
  build-dev:
    script: "wasm-pack build --dev --target web --scope Typbase . --features wasm-simd"
    inputs:
      - "Cargo.toml"
      - "pkg/package.json"
      - "src/**/*"
      - "build.rs"
      - "/platform/Cargo.toml"
      - "/platform/Cargo.lock"
    outputs:
      - "pkg/**/*"

  build:
    script: "wasm-pack build --release --target web --scope Typbase . --features wasm-simd"
    inputs:
      - "Cargo.toml"
      - "pkg/package.json"
      - "src/**/*"
      - "build.rs"
      - "/platform/Cargo.toml"
      - "/platform/Cargo.lock"
    outputs:
      - "pkg/**/*"
