[package]
name = "wasm"

# authors.workspace = true
categories.workspace = true
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
# repository.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pdf"]
pdf = ["dep:typst-pdf"]
wasm-simd = []

[dependencies]
comemo = { version = "0.5.0" }
dashmap = { version = "6.1.0" }
ecow = { version = "0.2.6" }
flate2 = { version = "1.1.8" }
indoc = { version = "2.0.7" }
itertools = { version = "0.15.0" }
js-sys = { version = "0.3", default-features = false }
rustc-hash = { version = "2.1" }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_bytes = "0.11"
tar = { version = "0.4" }
time = { version = "0.3", features = ["serde", "wasm-bindgen"] }
# tiny-skia = { version = "0.11" }
tsify = { version = "0.5.6", features = ["js"] }
typst = { version = "0.15.1" }
typst-html = { version = "0.15.1" }
typst-ide = { version = "0.15.1" }
typst-layout = { version = "0.15.1" }
typst-macros = { version = "0.15.1" }
typst-pdf = { version = "0.15.1", optional = true }
# typst-render = { version = "0.15.1" }
typst-svg = { version = "0.15.1" }
typst-syntax = { version = "0.15.1" }
typst-timing = { version = "0.15.1" }
wasm-bindgen = { version = "0.2" }

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }
insta = { version = "1.46.3", features = ["json"] }
walkdir = { version = "2.5.0" }
wasm-bindgen-test = { version = "0.3" }

[lints]
workspace = true

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "-all"]
